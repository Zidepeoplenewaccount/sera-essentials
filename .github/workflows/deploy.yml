name: Deploy SERA website to InfinityFree

concurrency:
  group: sera-infinityfree-deploy
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload website files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove Git metadata before deployment
        run: rm -rf .git

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git/**
            .git/**
            **/.github/**
            **/README*
            **/supabase-setup.sql
            images/foamy-bubbling-maker.jpg
